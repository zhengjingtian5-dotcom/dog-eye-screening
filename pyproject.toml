[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogeye"
version = "0.1.0"
description = "Screen phone photos of dog eyes for signs that need a vet visit"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "imagehash>=4.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
data = ["roboflow>=1.1"]
features = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
